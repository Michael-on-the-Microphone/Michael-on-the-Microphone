<!doctype html>
<html lang="en" data-nav="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#1b3fd3;color:#fff;font-family:'Space Grotesk',sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:64px 24px 160px}
h1{font-size:clamp(44px,7vw,84px);font-weight:700;letter-spacing:-.03em;line-height:.95;margin:0}
.lede{font-size:17px;max-width:48ch;margin:18px 0 48px;line-height:1.5;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:170px;gap:14px;grid-auto-flow:dense}
.room{border:1.5px solid rgba(255,255,255,.85);border-radius:4px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;transition:background .15s,color .15s}
.room:hover{background:#fff;color:#1b3fd3}
.room.xl{grid-column:span 2;grid-row:span 2}
.room.l{grid-column:span 2}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.vn{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.xl .vn{font-size:30px}
.ct{font-size:44px;font-weight:700;line-height:.85;letter-spacing:-.04em}
.xl .ct{font-size:92px}
.list{font-size:12.5px;line-height:1.45;margin-top:10px;overflow:hidden}
.list div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .f{opacity:.6}
.list .f::after{content:' (soon)'}
.city{font-size:12px;opacity:.75}
.vi{font-size:12px;opacity:.78;margin-top:3px;line-height:1.3}
.fx{display:none;font-size:12.5px;line-height:1.4;opacity:.85;margin-top:10px;max-width:46ch}
.xl .fx{display:block}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.grid{grid-template-columns:1fr;grid-auto-rows:auto}.room.xl,.room.l{grid-column:span 1;grid-row:span 1}.xl .ct{font-size:56px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>The rooms I keep<br>coming back to.</h1>
  <p class="lede" id="lede"></p>
  <div class="grid" id="grid"></div>
</div>
<script src="../../shows.js"></script><script src="../../shows-enriched.js"></script><script src="../../common.js"></script>
<script>
const {el,SHOWS,split,fmt,isPast,byVenue} = LE;
const groups=byVenue();
document.getElementById('lede').textContent=`${groups.length} rooms, ${SHOWS.length} shows, one city. Bigger box, more nights. The Shrine is winning.`;
const g=document.getElementById('grid');
groups.forEach(([v,shows])=>{
  const n=shows.length;
  const cls=n>=4?'xl':n>=2?'l':'';
  const vi=shows.map(LE.venueInfo).find(Boolean);
  g.append(el('article',{class:'room '+cls},
    el('div',{class:'top'},el('div',{},el('div',{class:'vn'},v),shows[0].city!=='Los Angeles'?el('div',{class:'city'},shows[0].city):null,vi?el('div',{class:'vi'},[vi.type,vi.capacity&&String(vi.capacity).split('(')[0].trim().slice(0,22)+(/\d/.test(vi.capacity)?' cap':''),vi.neighborhood].filter(Boolean).join(' · ')):null),el('div',{class:'ct'},n)),
    el('div',{class:'list'},shows.map(s=>el('div',{class:isPast(s)?'':'f'},`${fmt(s.date,'short')} ${split(s).name}`)),
      vi&&vi.facts&&vi.facts[0]?el('div',{class:'fx'},vi.facts.slice().sort((a,b)=>a.length-b.length)[0]):null)));
});
LE.nav();
</script>
</body></html>
