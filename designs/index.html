<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live, love, laugh. Shows, 14 ways</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f3;color:#111;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:72px 24px 120px}
h1{font-size:clamp(36px,6vw,64px);font-weight:700;letter-spacing:-.03em;line-height:1;margin:0}
.lede{font-size:17px;color:#555;max-width:52ch;line-height:1.5;margin:14px 0 40px}
ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
li a{display:block;background:#fff;border:1px solid #e3e3e0;border-radius:8px;padding:16px 18px;text-decoration:none;color:inherit;height:100%}
li a:hover{border-color:#111}
.n{font-size:12px;color:#888;font-variant-numeric:tabular-nums}
.t{font-size:20px;font-weight:600;margin:4px 0 6px;letter-spacing:-.01em}
.d{font-size:13.5px;color:#555;line-height:1.4}
.k{font-size:12.5px;color:#888;margin-top:36px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>Live, love, laugh.</h1>
  <p class="lede">The shows, 14 ways. Each design is the same list of 32 nights in Los Angeles (plus one in Seattle), told in a different material. Use ← → on any page to flip through.</p>
  <ol id="list"></ol>
  <p class="k">Data lives in shows.js. Each design is a single HTML file in its numbered folder.</p>
</div>
<script>
const designs=[
  ['Stubs','Torn ticket stubs in a shoebox. Torn means I went.'],
  ['Receipt','A thermal receipt for a year and a half of nights out. Total: priceless.'],
  ['Marquee','A theater letterboard with bulbs. Tonight, coming soon, previously.'],
  ['Timeline','A quiet editorial timeline with a red line where today is.'],
  ['Rooms','Venues as boxes sized by how often I go back.'],
  ['Calendar','Wall calendar, every show day marked in pink.'],
  ['Posters','Gig posters pasted on a concrete wall, each in its own style.'],
  ['Index','Big black type, numbered, nothing else.'],
  ['Scrapbook','Polaroids and washi tape on kraft paper.'],
  ['Log','An amber terminal printing shows.log.'],
  ['Crate','A record crate you dig through sideways.'],
  ['Numbers','A bar chart by month and a few honest counts.'],
  ['Wristbands','Festival wristbands stacked up the arm, never cut off.'],
  ['Setlist','Handwritten setlists taped to the stage, encore still to come.'],
];
document.getElementById('list').innerHTML=designs.map(([t,d],i)=>`<li><a href="${i+1}/"><div class="n">${String(i+1).padStart(2,'0')}</div><div class="t">${t}</div><div class="d">${d}</div></a></li>`).join('');
</script>
</body></html>
