<style>
.pile{gap:44px 26px;align-items:flex-start}
.tag{position:relative;width:168px;height:236px;background:var(--stock);border-radius:10px;transform:rotate(var(--rot));box-shadow:0 1px 1px rgba(0,0,0,.15),0 10px 20px -10px rgba(0,0,0,.35);transition:transform .18s;padding:40px 14px 14px;display:flex;flex-direction:column;justify-content:space-between}
.tag:hover{transform:rotate(0) translateY(-5px);z-index:3}
.tag::before{content:'';position:absolute;top:12px;left:50%;width:16px;height:16px;border-radius:50%;background:var(--desk);transform:translateX(-50%);box-shadow:inset 0 1px 2px rgba(0,0,0,.35),0 0 0 3px rgba(255,255,255,.55)}
.tag::after{content:'';position:absolute;top:-26px;left:50%;width:2px;height:40px;background:#8c8477;transform:translateX(-50%) rotate(var(--string));transform-origin:bottom;z-index:-1}
.tag.punched .kind::after{content:'';position:absolute;right:14px;top:40px;width:26px;height:26px;border-radius:50%;background:var(--desk);box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.kind{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.name{font-family:Oswald,sans-serif;font-weight:700;font-size:25px;line-height:.95;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin:10px 0}
.area{font-size:10.5px;line-height:1.4}
.area b{display:block;font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:10px;opacity:.7}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="brand" href="../">Live, love, laugh.</a>
    <nav class="menu"><a href="../shows/">Shows</a><a href="../movies/">Movies</a><a href="../places/" aria-current="page">Places</a><a href="../games/">Games</a></nav></header>
  <h1>Days<br>out</h1>
  <p class="lede" id="lede"></p>
  <div class="pile" id="pile"></div>
  <p class="empty" id="empty" hidden>These are samples. Add your own in <code>data/places.js</code>. A punched tag means you went.</p>
</div>
<script src="../shows.js"></script><script src="../data/places.js"></script><script src="../common.js"></script>
<script>
const {el,fmt,hash,TODAY} = LE;
const list=[...window.PLACES].sort((a,b)=>a.date.localeCompare(b.date));
const real=list.filter(p=>!p.example), been=real.filter(p=>p.date<TODAY);
document.getElementById('lede').textContent=real.length?`${been.length} days out so far, hikes to museums to the odd road trip. ${real.length-been.length} planned.`:'Admission tags from the trails, beaches, museums and road trips. Punched means I went.';
document.getElementById('empty').hidden=real.length>0;
const kindStock={hike:'#d7ebc0',beach:'#c6dcf4',museum:'#ead3f2',trip:'#ffdcae',neighborhood:'#f3e39a',food:'#f6c8bf',other:'#cfe9e4'};
const pile=document.getElementById('pile');
list.forEach(p=>{
  const r=hash(p.date+p.name), kind=(p.kind||'other').toLowerCase();
  pile.append(el('article',{class:'tag'+(p.date<TODAY?' punched':''),style:`--stock:${kindStock[kind]||kindStock.other};--rot:${((r%7)-3)*1.2}deg;--string:${((r>>>3)%5-2)*4}deg`},
    p.example?el('span',{class:'stamp grey'},'Sample'):null,
    el('div',{},el('div',{class:'kind'},kind+(p.date<TODAY?'':' (planned)')),el('div',{class:'name'},p.name)),
    el('div',{class:'area'},el('b',{},p.area||'Los Angeles'),fmt(p.date,'long'),p.note?el('div',{style:'opacity:.7;margin-top:4px'},p.note):null)));
});
</script>
</body></html>
