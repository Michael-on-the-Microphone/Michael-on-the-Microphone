<style>
.pile{gap:36px 24px}
.tk{position:relative;width:410px;max-width:100%;height:124px;background:var(--stock);transform:rotate(var(--rot));box-shadow:0 1px 1px rgba(0,0,0,.15),0 10px 20px -10px rgba(0,0,0,.35);transition:transform .18s;display:grid;grid-template-columns:1fr 84px 60px}
.tk:hover{transform:rotate(0) translateY(-5px);z-index:3}
.tk.torn{clip-path:polygon(0 0,98% 0,100% 6%,97.5% 13%,99.5% 22%,97% 31%,99.5% 40%,97.5% 48%,99.5% 57%,97% 66%,99.5% 75%,97.5% 84%,100% 92%,98% 100%,0 100%)}
.tk::before,.tk::after{content:'';position:absolute;right:64px;width:14px;height:14px;border-radius:50%;background:var(--desk);transform:translateX(50%);z-index:1}
.tk::before{top:-7px}.tk::after{bottom:-7px}
.main{padding:11px 14px 10px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.vs{font-family:Oswald,sans-serif;font-weight:700;font-size:23px;line-height:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;margin:6px 0 2px}
.vs i{font-style:normal;font-weight:500;font-size:.6em;margin:0 .25em;opacity:.6}
.seats{border-left:1.5px solid rgba(0,0,0,.25);padding:10px 8px;display:grid;grid-template-rows:repeat(3,1fr);font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.seats div{display:flex;justify-content:space-between;align-items:center}
.seats b{font-family:Oswald,sans-serif;font-size:15px;font-weight:700;letter-spacing:0}
.stubend{border-left:2px dashed rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center}
.stubend span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.res{position:absolute;right:158px;top:50%;width:46px;height:46px;border-radius:50%;border:3px solid var(--red);color:var(--red);font-family:Oswald,sans-serif;font-weight:700;font-size:26px;display:flex;align-items:center;justify-content:center;transform:translateY(-50%) rotate(-14deg);opacity:.5;z-index:2;pointer-events:none;mix-blend-mode:multiply}
.res.l{border-color:#555;color:#555}
@media (max-width:480px){.tk{grid-template-columns:1fr 52px;height:112px}.seats{display:none}.tk::before,.tk::after{right:52px}.res{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="brand" href="../">Live, love, laugh.</a>
    <nav class="menu"><a href="../shows/">Shows</a><a href="../movies/">Movies</a><a href="../places/">Places</a><a href="../games/" aria-current="page">Games</a></nav></header>
<main>
  <h1>Scoreboard<br>nights</h1>
  <p class="lede" id="lede"></p>
  <div class="pile" id="pile"></div>
  <p class="empty" id="empty" hidden>These are samples. Add your own in <code>data/games.js</code>. The circle says who won.</p>
</main>
<footer class="foot"><span>Live, love, laugh. Praveen, Los Angeles.</span><span><a href="../">Home</a> · <a href="https://github.com/Michael-on-the-Microphone/Michael-on-the-Microphone">Source</a></span></footer>
</div>
<script src="../shows.js"></script><script src="../data/games.js"></script><script src="../common.js"></script>
<script>
const {el,fmt,hash,TODAY} = LE;
const list=[...window.GAMES].sort((a,b)=>a.date.localeCompare(b.date));
const real=list.filter(g=>!g.example), been=real.filter(g=>g.date<TODAY);
const wins=been.filter(g=>g.result==='W').length;
document.getElementById('lede').textContent=real.length?`${been.length} games, ${wins} wins from my seat. ${real.length-been.length} tickets still whole.`:'Every USC home game at the Coliseum since the 2025 season. The red circle says who won.';
document.getElementById('empty').hidden=real.length>0;
const sportStock={baseball:'#c6dcf4',football:'#f6c8bf',basketball:'#f3e39a',soccer:'#d7ebc0',hockey:'#cfe9e4'};
const pile=document.getElementById('pile');
list.forEach(g=>{
  const r=hash(g.date+g.home+g.away), sport=(g.sport||'').toLowerCase(), past=g.date<TODAY;
  pile.append(el('article',{class:'tk'+(past?' torn':''),style:`--stock:${sportStock[sport]||'#ead3f2'};--rot:${((r%7)-3)*.8}deg`},
    g.example?el('span',{class:'stamp grey'},'Sample'):null,
    past&&g.result?el('span',{class:'res '+g.result.toLowerCase()},g.result):null,
    el('div',{class:'main'},
      el('div',{class:'row'},el('span',{},(LE.VENUE_SHORT&&LE.VENUE_SHORT[g.venue])||g.venue||'Venue TBA'),el('span',{},g.sport||'')),
      el('div',{class:'vs'},g.home,el('i',{},'vs'),g.away),
      el('div',{class:'row'},el('span',{},fmt(g.date,innerWidth<480?'med':'long')),el('span',{},g.score?((innerWidth<480&&g.result)?g.result+' ':'Final ')+g.score:(past?'':'Upcoming')))),
    el('div',{class:'seats'},el('div',{},'Sec',el('b',{},String(100+r%250))),el('div',{},'Row',el('b',{},String(1+(r>>>5)%30))),el('div',{},'Seat',el('b',{},String(1+(r>>>9)%20)))),
    el('div',{class:'stubend'},el('span',{},fmt(g.date,'num')))));
});
const fit=()=>document.querySelectorAll('.vs').forEach(n=>{let fs=23;n.style.fontSize='';while(n.scrollWidth>n.clientWidth&&fs>14){fs-=1;n.style.fontSize=fs+'px';}});
document.fonts.ready.then(fit);
</script>
</body></html>
